kind = "web"
previewPath = "/"
title = "CovenantWatch"
version = "1.0.0"
id = "artifacts/covenant-watch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20371

[services.development]
run = "pnpm --filter @workspace/covenant-watch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/covenant-watch", "run", "build" ]
publicDir = "artifacts/covenant-watch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20371"
BASE_PATH = "/"
